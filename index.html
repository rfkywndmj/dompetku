<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu - Catatan Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans">

    <!-- Container Utama -->
    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- Header Aplikasi -->
        <header class="flex justify-between items-center py-2 border-b border-slate-800">
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-blue-600 bg-clip-text text-transparent">DompetKu</h1>
                <p class="text-xs text-slate-400">Pencatat Keuangan AI</p>
            </div>
            <button onclick="fetchTransactions()" class="p-2 bg-slate-900 rounded-xl border border-slate-800 hover:border-sky-500/50 text-slate-300">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </header>

        <!-- Card Saldo -->
        <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950/40 p-5 rounded-3xl border border-sky-500/20 shadow-xl space-y-4">
            <span class="text-xs text-slate-400 font-medium">Total Saldo</span>
            <h2 id="totalBalance" class="text-3xl font-extrabold text-white">Rp 0</h2>
            
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80 text-xs">
                <div>
                    <span class="text-slate-400 flex items-center gap-1"><i data-lucide="arrow-down-left" class="w-3 h-3 text-emerald-400"></i> Pemasukan</span>
                    <p id="totalIncome" class="text-emerald-400 font-bold text-sm mt-0.5">Rp 0</p>
                </div>
                <div>
                    <span class="text-slate-400 flex items-center gap-1"><i data-lucide="arrow-up-right" class="w-3 h-3 text-rose-400"></i> Pengeluaran</span>
                    <p id="totalExpense" class="text-rose-400 font-bold text-sm mt-0.5">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Tombol Aksi Tambah Transaksi -->
        <button onclick="openModal()" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-2xl shadow-lg shadow-sky-500/20 transition flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>Tambah Transaksi Baru</span>
        </button>

        <!-- Daftar Transaksi Terakhir -->
        <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-300 flex items-center justify-between">
                <span>Riwayat Transaksi</span>
                <span id="txCount" class="text-xs font-normal text-slate-500">0 Transaksi</span>
            </h3>

            <div id="transactionList" class="space-y-2">
                <div class="text-center py-8 text-slate-500 text-xs">
                    ⏳ Memuat data transaksi...
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Form Transaksi -->
    <div id="transactionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="font-bold text-slate-200">Tambah Transaksi</h3>
                <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Auto-Scan Resi / Screenshot Section -->
            <div class="bg-slate-950/80 p-3 rounded-2xl border border-sky-500/30 text-center">
                <label class="cursor-pointer flex items-center justify-center gap-2 text-xs font-bold text-sky-400 hover:text-sky-300 py-1">
                    <i data-lucide="scan-line" class="w-4 h-4"></i>
                    <span>Scan Bukti Transfer / Screenshot</span>
                    <input type="file" id="scanInput" accept="image/*" capture="environment" class="hidden" onchange="handleScanImage(event)">
                </label>
                <p id="scanStatus" class="text-[10px] text-slate-400 mt-1 hidden">⏳ AI sedang membaca resi...</p>
            </div>

            <!-- Form Inputs -->
            <form id="txForm" onsubmit="submitTransaction(event)" class="space-y-3 text-xs">
                
                <div>
                    <label class="block text-slate-400 mb-1">Tipe Transaksi</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="txType" value="pengeluaran" checked class="peer hidden" onchange="toggleTypeStyle()">
                            <div class="py-2.5 text-center rounded-xl bg-slate-800 text-slate-400 peer-checked:bg-rose-500/20 peer-checked:text-rose-400 peer-checked:border peer-checked:border-rose-500/50 font-bold transition">
                                Pengeluaran
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="txType" value="pemasukan" class="peer hidden" onchange="toggleTypeStyle()">
                            <div class="py-2.5 text-center rounded-xl bg-slate-800 text-slate-400 peer-checked:bg-emerald-500/20 peer-checked:text-emerald-400 peer-checked:border peer-checked:border-emerald-500/50 font-bold transition">
                                Pemasukan
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Nominal (Rp)</label>
                    <input type="text" id="txAmount" placeholder="Contoh: 50.000" required oninput="formatCurrencyInput(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 font-bold text-base focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1">Deskripsi / Nama Merchant</label>
                    <input type="text" id="txTitle" placeholder="Contoh: Kopi / Pembayaran GoFood" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-sky-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">Kategori</label>
                        <select id="txCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-sky-500 capitalize">
                            <option value="makanan">Makanan</option>
                            <option value="transportasi">Transportasi</option>
                            <option value="tagihan">Tagihan</option>
                            <option value="hiburan">Hiburan</option>
                            <option value="belanja">Belanja</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Tanggal</label>
                        <input type="date" id="txDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-2xl transition mt-2">
                    Simpan Transaksi
                </button>
            </form>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // URL Web App Google Apps Script Milikmu
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcI0v86mZ5q0Z3rP5s_G_a8qR8k7Gg/exec"; // <-- Pastikan URL Apps Script Kamu Benar di Sini

        let transactions = [];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setDefaultDate();
            fetchTransactions();
        });

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('txDate').value = today;
        }

        function openModal() {
            document.getElementById('transactionModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('transactionModal').classList.add('hidden');
            document.getElementById('txForm').reset();
            setDefaultDate();
            const statusEl = document.getElementById('scanStatus');
            statusEl.classList.add('hidden');
        }

        function formatCurrencyInput(input) {
            let value = input.value.replace(/\D/g, '');
            if (value) {
                input.value = parseInt(value, 10).toLocaleString('id-ID');
            } else {
                input.value = '';
            }
        }

        function parseCurrency(str) {
            return parseInt(str.toString().replace(/\D/g, ''), 10) || 0;
        }

        async function fetchTransactions() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                transactions = await res.json();
                renderUI();
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('transactionList').innerHTML = `<div class="text-center py-4 text-rose-400 text-xs">Gagal mengambil data transaksi.</div>`;
            }
        }

        function renderUI() {
            let balance = 0, income = 0, expense = 0;

            transactions.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (t.type === 'pemasukan') {
                    income += amt;
                    balance += amt;
                } else {
                    expense += amt;
                    balance -= amt;
                }
            });

            document.getElementById('totalBalance').textContent = `Rp ${balance.toLocaleString('id-ID')}`;
            document.getElementById('totalIncome').textContent = `Rp ${income.toLocaleString('id-ID')}`;
            document.getElementById('totalExpense').textContent = `Rp ${expense.toLocaleString('id-ID')}`;
            document.getElementById('txCount').textContent = `${transactions.length} Transaksi`;

            const listEl = document.getElementById('transactionList');
            if (transactions.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Belum ada transaksi. Tambahkan sekarang!</div>`;
                return;
            }

            listEl.innerHTML = transactions.slice().reverse().map(t => {
                const isExpense = t.type === 'pengeluaran';
                return `
                    <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-xl ${isExpense ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}">
                                <i data-lucide="${isExpense ? 'arrow-up-right' : 'arrow-down-left'}" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-200 text-xs">${t.title}</h4>
                                <p class="text-[10px] text-slate-400 capitalize">${t.category} • ${t.date}</p>
                            </div>
                        </div>
                        <span class="font-bold text-xs ${isExpense ? 'text-rose-400' : 'text-emerald-400'}">
                            ${isExpense ? '-' : '+'}Rp ${Number(t.amount).toLocaleString('id-ID')}
                        </span>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        async function handleScanImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('scanStatus');
            statusEl.classList.remove('hidden');
            statusEl.className = "text-[10px] text-sky-400 mt-1.5 animate-pulse font-medium";
            statusEl.textContent = "⏳ AI Gemini sedang membaca bukti transfer...";

            const reader = new FileReader();
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                const mimeType = file.type;

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: "scan_ocr",
                            imageBase64: base64Data,
                            mimeType: mimeType
                        })
                    });

                    const data = await response.json();

                    if (data && data.amount) {
                        document.getElementById('txAmount').value = parseInt(data.amount, 10).toLocaleString('id-ID');
                        if (data.title) document.getElementById('txTitle').value = data.title;
                        if (data.category) document.getElementById('txCategory').value = data.category.toLowerCase();
                        if (data.date) document.getElementById('txDate').value = data.date;

                        statusEl.className = "text-[10px] text-emerald-400 mt-1.5 font-medium";
                        statusEl.textContent = "✅ Bukti bayar berhasil dibaca!";
                    } else {
                        statusEl.className = "text-[10px] text-rose-400 mt-1.5";
                        statusEl.textContent = "❌ Gagal membaca detail resi. Silakan isi manual.";
                    }
                } catch (err) {
                    console.error("Scan Error:", err);
                    statusEl.className = "text-[10px] text-rose-400 mt-1.5";
                    statusEl.textContent = "❌ Terjadi kesalahan saat memproses gambar.";
                } finally {
                    event.target.value = '';
                }
            };

            reader.readAsDataURL(file);
        }

        async function submitTransaction(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = "Menyimpan...";

            const selectedType = document.querySelector('input[name="txType"]:checked').value;

            const payload = {
                id: "tx_" + Date.now(),
                date: document.getElementById('txDate').value,
                title: document.getElementById('txTitle').value,
                category: document.getElementById('txCategory').value,
                type: selectedType,
                amount: parseCurrency(document.getElementById('txAmount').value),
                account: 'tabungan1'
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                closeModal();
                await fetchTransactions();
            } catch (err) {
                console.error("Submit Error:", err);
                alert("Gagal menyimpan transaksi.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Simpan Transaksi";
            }
        }
    </script>
</body>
</html>
